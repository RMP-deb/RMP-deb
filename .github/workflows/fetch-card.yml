name: Update fetch card

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/fetch-card.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Generate SVGs
        env:
          # Swap for a PAT in a repo secret (secrets.FETCH_TOKEN) to include private contributions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || (git commit -m "Update fetch card" && git push)
